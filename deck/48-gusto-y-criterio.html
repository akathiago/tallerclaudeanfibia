<!doctype html>
<!--
  ══════════════════════════════════════════════════════════════════
  ANFIBIA · SLIDE DE CITA — 1920 × 1080 (16:9)
  ══════════════════════════════════════════════════════════════════

  Es el "pull-quote" del sitio a pantalla completa: fondo negro,
  texto lime, comilla rosa.

  CÓMO USARLO
  1. Doble click para verlo en el navegador.
  2. Para editar, abrilo con el Bloc de notas / TextEdit / VS Code.
  3. Cambiá solo lo que dice "EDITÁ ACÁ".

  OJO: la cita tiene que ser CORTA. Si pasa de 20 palabras, achicá el
  texto o partila en dos slides. No agrandes la caja.

  NO TOQUES el bloque <style>.
  ══════════════════════════════════════════════════════════════════
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>ANFIBIA — Slide de cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;700;900&family=Silkscreen:wght@400;700&family=Space+Mono:wght@400&family=VT323&display=swap">
<style>
  /* ——— TOKENS · copia exacta de tokens/tokens.css. No editar. ——— */
  :root {
    --cream: #f0e9d8;
    --paper: #e8e0cc;
    --lime: #c6f526;
    --electric: #1e1eff;
    --pink: #ff2a6d;
    --black: #0d0d0d;
    --gray: #6b6b5a;
    --cream-mute: #bbb5a7;

    --fuente-titulo: 'Darker Grotesque', 'Arial Narrow', Impact, sans-serif;
    --fuente-pixel: 'Silkscreen', 'Courier New', monospace;
    --fuente-mono: 'Space Mono', 'Courier New', monospace;
    --fuente-terminal: 'VT323', 'Courier New', monospace;

    /* Color de la comilla: var(--pink) var(--lime) var(--electric) */
    --acento: var(--pink);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2a28;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 40px 0;
    gap: 24px;
  }

  .lienzo {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: var(--black);
    color: var(--cream);
    padding: 80px 120px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .comilla {
    font-family: var(--fuente-pixel);
    font-size: 200px;
    line-height: 0.7;
    color: var(--acento);
    opacity: 0.5;
    user-select: none;
    height: 120px;
  }

  .cita {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: 132px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--lime);
    max-width: 1620px;
    text-wrap: balance;
  }

  .firma-cita {
    font-family: var(--fuente-terminal);
    font-size: 36px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 44px;
  }

  .fila { display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .logo { font-family: var(--fuente-pixel); font-size: 26px; color: var(--cream-mute); }

  .firma { display: flex; gap: 12px; }
  .firma i { width: 20px; height: 20px; border: 2px solid var(--gray); display: block; }
  .firma i:nth-child(1) { background: var(--lime); }
  .firma i:nth-child(2) { background: var(--pink); }
  .firma i:nth-child(3) { background: var(--electric); }

  .ayuda {
    width: 100%;
    background: var(--black); color: var(--lime);
    font-family: var(--fuente-terminal); font-size: 18px;
    padding: 10px 20px; text-align: center; z-index: 99;
  }
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    body { background: none; padding: 0; display: block; }
    .ayuda { display: none; }
  }
</style>
</head>
<body>
<div class="lienzo">
  <div class="comilla">"</div>
  <div><blockquote class="cita">PRODUCIR ES MÁS BARATO / ELEGIR BIEN VALE MÁS</blockquote><p class="firma-cita">— USOS Y CRITERIO</p></div>
  <div class="fila"><div class="logo">ANFIBIA</div><div class="firma"><i></i><i></i><i></i></div></div>
</div>
<div class="ayuda">SLIDE DE CITA · 1920×1080 · EDITÁ SOLO DONDE DICE "EDITÁ ACÁ" · ESTA BARRA NO SALE EN LA IMAGEN</div>
</body>
</html>
